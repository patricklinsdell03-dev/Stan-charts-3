name: Weekly Weinstein scan
 
on:
  schedule:
    # 08:00 UTC every Saturday. US and UK weekly bars are both final by then,
    # which matters: running before Friday's close scores a partial week whose
    # volume figure is truncated and whose close is not a weekly close.
    - cron: "0 8 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "scan runs the weekly scan; doctor checks every external dependency and reports which one is broken"
        default: scan
        type: choice
        options: [scan, doctor]
      crypto:
        description: "also score the crypto board to its own page"
        default: true
        type: boolean
      tradeable_only:
        description: "keep only names Trading 212 lists (needs the T212_API_KEY secret)"
        default: false
        type: boolean
      wide:
        description: "scan every listed US name plus the FTSE small cap tiers (hours, not minutes)"
        default: false
        type: boolean
 
permissions:
  contents: write
 
jobs:
  scan:
    runs-on: ubuntu-latest
    # Raised from 45 for the widened universe. Trading 212 lists thousands of
    # US and UK lines, and Yahoo is downloaded in throttled batches, so a full
    # tradeable scan takes hours rather than minutes. Public repositories get
    # unlimited Actions minutes, so the cost of a long Saturday run is zero; the
    # cost of a timeout is a week with no scan at all.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
 
      - name: Ensure the project files are present
        # The GitHub web uploader, and every mobile browser, drops FOLDERS on
        # drag-and-drop and keeps only loose top-level files. The symptom is that
        # requirements.txt installs happily and then the scan cannot import the
        # package that never arrived. Rather than making you recreate fifteen
        # files by hand, this accepts the project as a single uploaded zip, which
        # is one file and therefore survives that upload path intact.
        run: |
          set -e
          if [ ! -f weinstein/cli.py ]; then
            echo "No weinstein/ package at the repository root. Looking for a zip."
            zip=$(ls -1 weinstein-tracker*.zip 2>/dev/null | head -n1 || true)
            if [ -z "$zip" ]; then
              echo "::error::Found neither a weinstein/ folder nor a weinstein-tracker zip."
              echo "Upload weinstein-tracker.zip to the repository root and re-run."
              ls -la
              exit 1
            fi
            echo "Extracting $zip"
            unzip -oq "$zip"
            if [ -d weinstein-tracker ]; then
              shopt -s dotglob
              cp -r weinstein-tracker/* .
              rm -rf weinstein-tracker
            fi
          fi
          test -f weinstein/cli.py || { echo "::error::still no weinstein/cli.py"; ls -la; exit 1; }
          python3 -c "import weinstein; print('package imports cleanly')"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
 
      - run: pip install -r requirements.txt
 
      - name: Preflight
        if: ${{ github.event.inputs.mode == 'doctor' }}
        run: python -m weinstein.cli doctor
 
      - name: Run scan
        if: ${{ github.event.inputs.mode != 'doctor' }}
        env:
          # Optional. Absent, the tradeability pass is skipped and the scan runs
          # on index membership alone rather than failing.
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
        run: |
          set -e
          args="--out docs/index.html"
          # A scheduled run has no inputs at all, so these resolve to empty and
          # must default to something sensible rather than to "off".
          if [ "${{ github.event.inputs.wide }}" = "true" ]; then
            args="$args --wide"
          fi
          if [ "${{ github.event.inputs.crypto }}" != "false" ]; then
            args="$args --crypto --crypto-out docs/crypto.html"
          fi
          if [ "${{ github.event.inputs.tradeable_only }}" = "true" ] && [ -n "$T212_API_KEY" ]; then
            args="$args --tradeable-only --extend-tradeable"
          elif [ -n "$T212_API_KEY" ]; then
            args="$args --extend-tradeable"
          fi
          echo "running: $args"
          python -m weinstein.cli scan $args
      - name: Upload dashboard as a run artifact
        if: ${{ github.event.inputs.mode != 'doctor' }}
        # Lets a private repository, where GitHub Pages is unavailable on the
        # free tier, still collect each week's dashboard by download.
        uses: actions/upload-artifact@v4
        with:
          name: weinstein-dashboard
          path: |
            docs/index.html
            docs/index_full.csv
            docs/index_alerts.csv
            docs/crypto.html
            docs/crypto_alerts.csv
          retention-days: 90
          if-no-files-found: warn
 
      - name: Commit dashboard
        if: ${{ github.event.inputs.mode != 'doctor' }}
        run: |
          git config user.name  "weinstein-bot"
          git config user.email "actions@github.com"
          for f in docs/index.html docs/index_alerts.csv docs/crypto.html \
                   docs/crypto_alerts.csv log/signals.csv cache/universe_*.csv \
                   cache/events.csv cache/t212_instruments.csv; do
            [ -e "$f" ] && git add -f "$f"
          done
          git diff --staged --quiet || git commit -m "weekly scan $(date -u +%Y-%m-%d)"
          git push
